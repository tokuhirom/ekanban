# ワークスペースのルート。ここにはパッケージを置かない。
#
# `crates/core` が盤面のモデル・SQLite・控え・置き場所を持ち、UI ツールキットに
# 依存しない。`crates/app` が Tauri のアプリ（いまはコマンドの層だけ）。
# `crates/gpui` は gpui-kit で描く今のアプリで、Tauri へ移り終えたら消える
# （`docs/TAURI-MIGRATION.md` の段階 10）。
[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/gpui"]

[workspace.package]
# tagpr がここを書き換え、`script/bundle-mac` がここから .app のバージョンを作る
# (`.tagpr` を見てください)。行頭の `version = "..."` はこの 1 か所だけにする。
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ekanban-core = { path = "crates/core" }
# `serde` は期限 (`NaiveDate`) のためです。chrono の実装が "YYYY-MM-DD" の
# 文字列に落とすので、`docs/TAURI-MIGRATION.md` §3 の決めごとがそのまま出ます。
chrono = { version = "0.4.45", features = ["clock", "serde"] }
global-hotkey = "0.8.0"
gpui-kit = "0.6.0"
lsp-types = "0.97"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
# 型定義を Rust から生成する。手で 2 か所に書くと必ずずれる
# (`docs/TAURI-MIGRATION.md` §3)。書き出し先は `.cargo/config.toml`。
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-build = { version = "2.6.3", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
