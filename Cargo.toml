# ワークスペースのルート。ここにはパッケージを置かない。
#
# `crates/core` が盤面のモデル・SQLite・控え・置き場所を持ち、UI ツールキットに
# 依存しない。`crates/gpui` は gpui-kit で描く今のアプリで、Tauri へ移り終えたら
# 消える（`docs/TAURI-MIGRATION.md` の段階 10）。
[workspace]
resolver = "2"
members = ["crates/core", "crates/gpui"]

[workspace.package]
# tagpr がここを書き換え、`script/bundle-mac` がここから .app のバージョンを作る
# (`.tagpr` を見てください)。行頭の `version = "..."` はこの 1 か所だけにする。
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ekanban-core = { path = "crates/core" }
chrono = { version = "0.4.45", features = ["clock"] }
global-hotkey = "0.8.0"
gpui-kit = "0.6.0"
lsp-types = "0.97"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
