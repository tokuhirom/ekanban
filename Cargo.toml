# ワークスペースのルート。ここにはパッケージを置かない。
#
# `crates/core` が盤面のモデル・SQLite・控え・置き場所を持ち、UI ツールキットに
# 依存しない。`crates/app` が Tauri のアプリ。`crates/harness` は開発とテスト
# 専用で、そのコマンドを HTTP に出す。
[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/harness"]
# `cargo run` にアプリを選ばせる。これが無いと「どのバイナリか決められない」と
# 断られます (`ekanban` と `ekanban-harness` の 2 つがあるため)。
#
# **`--workspace` を省くと、ここに書いたものだけが対象になります。** `cargo test`
# だけを打つと `ekanban-core` のテストが走りません。Makefile と CI は全部
# `--workspace` を付けてあるので、`make check` を通す限りは全部走ります。
default-members = ["crates/app"]

[workspace.package]
# tagpr がここを書き換え、`script/bundle-mac` がここから .app のバージョンを作る
# (`.tagpr` を見てください)。行頭の `version = "..."` はこの 1 か所だけにする。
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ekanban-app = { path = "crates/app" }
ekanban-core = { path = "crates/core" }
# `serde` は期限 (`NaiveDate`) のためです。chrono の実装が "YYYY-MM-DD" の
# 文字列に落とすので、`docs/DESIGN.md`「境界を越える値」の決めごとがそのまま出ます。
chrono = { version = "0.4.45", features = ["clock", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
# 型定義を Rust から生成する。手で 2 か所に書くと必ずずれる
# (`docs/DESIGN.md`「境界を越える値」)。書き出し先は `.cargo/config.toml`。
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-build = { version = "2.6.3", features = [] }
# ファイルの選択と、場所を開くこと (`docs/DESIGN.md`「アプリが伝えること」)。
tauri-plugin-dialog = "2.7.3"
# クイックキャプチャのグローバルホットキー。中身は tauri-apps の `global-hotkey`
# なので、ADR 0012 の制約 (使えるのは macOS と X11 だけ) はそのままです。
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"

# 開発用ハーネスの HTTP。非同期ランタイムを持ち込まない小さいものを選ぶ。
tiny_http = "0.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
