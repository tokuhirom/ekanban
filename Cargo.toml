[package]
name = "ekanban"
version = "0.1.0"
edition = "2021"
description = "A local-first Kanban board built with Rust and GPUI Kit"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
global-hotkey = "0.8.0"
gpui-kit = "0.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
# GPUI のヘッドレステスト基盤 (TestPlatform / #[gpui_kit::test]) を使うための feature。
# 本体のビルドには要らないので dev-dependencies 側でだけ有効にする。
gpui-kit = { version = "0.6.0", features = ["test-support"] }
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
