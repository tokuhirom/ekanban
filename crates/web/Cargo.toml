# ブラウザだけで動く組み立て（[ADR 0035]）。
#
# `crates/app` のコマンドを **`wasm32-unknown-unknown` の上でそのまま動かし**、
# SQLite のファイルを `localStorage` に置きます。答えるのは本物の
# `ekanban-core` なので、ADR 0021 の「偽物のバックエンドを TypeScript で
# 書かない」がブラウザでも成り立ちます。
#
# ここに入るのは**環境の差だけ**です。保存先、ファイルの持ち出し方、URL の開き方
# ——盤面に関わる判断を 1 つでも書いたら、それは 2 つ目の実装です。
#
# [ADR 0035]: ../../docs/adr/0035-a-browser-build-of-the-real-core.md
[package]
name = "ekanban-web"
description = "ekanban のコマンドをブラウザで動かす wasm モジュール"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# wasm-bindgen が読む形。`rlib` も残すのは、ネイティブの `cargo build
# --workspace` がここを（中身の無いライブラリとして）通れるようにするためです。
crate-type = ["cdylib", "rlib"]

# **ネイティブでは何も持ち込みません。** ワークスペースの `cargo build` /
# `cargo test` はここを空のライブラリとして通ります（`src/lib.rs` の
# `#![cfg(target_family = "wasm")]`）。
[target.'cfg(target_family = "wasm")'.dependencies]
ekanban-app.workspace = true
ekanban-core.workspace = true
console_error_panic_hook.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Storage", "Window"] }

[lints]
workspace = true

# wasm-pack が最後に通す wasm-opt を使いません。
#
# **binaryen を 1 つ落としてくる手間に見合わなくなりました。** SQLite を外して
# から（ADR 0036）縮むのは 1 割ほどで、代わりに、組み立てがネットワークと
# binaryen の版に依存します——手元にある古い wasm-opt は、この wasm を壊します。
# 大きさが問題になったら、そのときに測ってから戻します。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
