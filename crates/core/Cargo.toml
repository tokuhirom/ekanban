[package]
name = "ekanban-core"
description = "ekanban の中核。盤面のモデル、SQLite、控え、置き場所、多重起動の防止"
version.workspace = true
edition.workspace = true
license.workspace = true

# ここに UI ツールキットを足さない。`tauri` に依存しないことが、
# テストを GUI のランタイム無しで走らせ続ける条件であり、Tauri のアプリと
# 開発用のハーネスが同じコードを使える条件でもある
# （`docs/DESIGN.md`「層の分け方」）。`make deps-check` が見張っている。
[dependencies]
chrono.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true

[features]
default = ["sqlite"]
# SQLite の置き場所 (`db/mod.rs`)。**配るアプリはこれです。**
#
# 外せるようにしてあるのは、ブラウザ版が JSON の置き場所を使うためです
# (`store::JsonStore`、ADR 0036)。`wasm32-unknown-unknown` に組んだ SQLite は
# それだけで 2.1 MB あり、こちらのコード全部より 5 倍大きい。
#
# **モデルはこの feature の外にあります。** 分かれているのは「どう置くか」だけ
# で、盤面の判断は `model.rs` の 1 つのままです。
sqlite = ["dep:rusqlite"]
# テスト用のボード (`Board::fixture`)。ほかのクレートからも使うので、
# crate をまたいで見えるようにこの feature で出す。実行ファイルには入らない。
test-fixtures = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
