# Tauri のアプリ。
#
# `docs/DESIGN.md`「コマンドとイベント」のコマンドを、Tauri に依らない普通の関数
# として持ちます（`commands.rs`）。`#[tauri::command]` はそれを呼ぶだけの薄い包み
# （`ipc.rs`）で、開発用のハーネスは同じ関数を HTTP に出します。**コマンドの中身が
# Tauri を知らないことは、包みの都合ではなく設計そのもの**です。
[package]
name = "ekanban-app"
description = "ekanban のコマンド層。盤面を変え、保存し、スナップショットを返す"
version.workspace = true
edition.workspace = true
license.workspace = true

# 実行ファイルの名前は `ekanban` です。デスクトップエントリの `StartupWMClass`
# はここから決まるので、変えるときは `crates/core` の `WM_CLASS` も一緒に
# 動かします (`docs/DESIGN.md`「ウィンドウ」)。
[[bin]]
name = "ekanban"
path = "src/main.rs"
# 殻を外した組み立て（`crates/web`、[ADR 0035]）には実行ファイルがありません。
# これが無いと `cargo build -p ekanban-app --no-default-features` が `run` の
# 無いライブラリに対して `main.rs` を組もうとして落ちます。
required-features = ["shell"]

[features]
default = ["shell"]
# Tauri の殻。窓、ネイティブのメニュー、OS のダイアログ、グローバルホットキー。
#
# **外せるようにしてあるのは、コマンドの層をブラウザでも動かすため**です
# （`crates/web`、[ADR 0035]）。外すと `commands` / `dispatch` / `state` /
# `snapshot` / `error` と、メニューの「データとしての構成」だけが残ります。
# 判断をこの feature の内側に置かないことは、ADR 0021 の「偽物のバックエンドを
# 書かない」がブラウザでも成り立つための条件です。
#
# [ADR 0035]: ../../docs/adr/0035-a-browser-build-of-the-real-core.md
shell = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-opener",
]

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dependencies]
ekanban-core.workspace = true
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
# コマンド名で振り分ける表（`dispatch.rs`）が、引数と答えを JSON で受け渡します。
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tauri-plugin-global-shortcut = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }

[dev-dependencies]
ekanban-core = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true

[lints]
workspace = true
