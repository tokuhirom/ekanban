# Tauri のアプリ。
#
# `docs/DESIGN.md`「コマンドとイベント」のコマンドを、Tauri に依らない普通の関数
# として持ちます（`commands.rs`）。`#[tauri::command]` はそれを呼ぶだけの薄い包み
# （`ipc.rs`）で、開発用のハーネスは同じ関数を HTTP に出します。**コマンドの中身が
# Tauri を知らないことは、包みの都合ではなく設計そのもの**です。
[package]
name = "ekanban-app"
description = "ekanban のコマンド層。盤面を変え、保存し、スナップショットを返す"
version.workspace = true
edition.workspace = true
license.workspace = true

# 実行ファイルの名前は `ekanban` です。デスクトップエントリの `StartupWMClass`
# はここから決まるので、変えるときは `crates/core` の `WM_CLASS` も一緒に
# 動かします (`docs/DESIGN.md`「ウィンドウ」)。
[[bin]]
name = "ekanban"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ekanban-core.workspace = true
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
tauri.workspace = true
thiserror.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-opener.workspace = true
ts-rs.workspace = true

[dev-dependencies]
ekanban-core = { workspace = true, features = ["test-fixtures"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
