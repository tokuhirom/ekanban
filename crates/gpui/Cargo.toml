# gpui-kit で描く今のアプリ。Tauri へ移り終えたら消える
# （`docs/TAURI-MIGRATION.md` の段階 10）。移行の間は凍結し、直すのは
# 使えなくなる不具合だけ（ADR 0017）。
[package]
name = "ekanban"
description = "A local-first Kanban board built with Rust and GPUI Kit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ekanban-core.workspace = true
chrono.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
lsp-types.workspace = true
rusqlite.workspace = true
thiserror.workspace = true

[dev-dependencies]
# テストが使うボード (`Board::fixture`) を出すための feature。
ekanban-core = { workspace = true, features = ["test-fixtures"] }
# GPUI のヘッドレステスト基盤 (TestPlatform / #[gpui_kit::test]) を使うための feature。
# 本体のビルドには要らないので dev-dependencies 側でだけ有効にする。
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
