# ブラウザ版（ADR 0042）を組み立てて、GitHub Pages に置く。
#
# **pull request でも組み立てて e2e まで走らせます。** 置くのは `main` に
# 入ったときだけですが、組み立てが壊れたことを merge のあとに知るのでは
# 遅いためです。
#
# **Rust は出てきません**（ADR 0042）。ブラウザ版はアプリと同じ TypeScript が
# そのまま動き、置き場所だけが `localStorage` に差し替わります。
#
# 初回だけ、リポジトリの設定で Pages の Source を「GitHub Actions」にする
# 必要があります。
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 置くのは 1 度に 1 つ。走っているものは止めません——途中で切ると、公開
# されているページが古い版のまま残ることがあります。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the browser build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the webview dependencies
        run: npm --prefix web ci

      - name: Build
        run: npm --prefix web run build:demo

      # 動いているのはアプリと同じ TypeScript です（ADR 0042）。置く前に、
      # ブラウザの中だけで盤面が残ることを確かめます。
      - name: Install the browser engine
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Run the browser build's end-to-end tests
        run: npm --prefix web run e2e:demo

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist-demo

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
