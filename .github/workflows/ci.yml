name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2 つの UI を抱えている間は、両方の依存が要ります。上の 11 行は gpui
      # (X11 と Vulkan)、下の 4 行は Tauri (WebKitGTK) のものです。段階 10 で
      # gpui を消したら上が要らなくなります。
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libx11-dev \
            libwayland-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 画面側は先に組み立てておきます。`crates/app` のビルドは
      # `web/dist` を実行ファイルに埋め込むので、無いとコンパイルが通りません。
      - name: Build the webview
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Check the webview
        run: |
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web run test

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      # Rust の型と、そこから生成した TypeScript の型がずれていないこと。
      # 上の `cargo test` が web/src/ipc/types/ に書き出すので、コミットして
      # あるものと突き合わせる (`docs/TAURI-MIGRATION.md` §3)。
      - name: Check the generated TypeScript types are up to date
        run: git diff --exit-code -- web/src/ipc/types

      - name: Build
        run: cargo build --workspace --all-features

      # 中核が UI ツールキットを引きずり込んでいないことを見る。
      # 依存の依存から入るほうがありがちなので、解決した依存グラフで確かめる
      # (`docs/TAURI-MIGRATION.md` §1)。
      - name: Check that the core crate stays free of UI toolkits
        run: script/check-core-independence

  # macOS と Windows でしか通らないコード（`crates/gpui/src/menu.rs` のネイティブ
  # メニューバー、`crates/core/src/paths.rs` と `crates/core/src/diagnostics.rs` の
  # cfg 分岐）は、ubuntu のジョブでは一度もコンパイルされない。ここで型検査と
  # テストだけ通す。
  #
  # `check` を matrix にしないのは意図的。matrix にすると check run の名前が
  # `Check and test (ubuntu-latest)` になり、ルールセットが必須にしている
  # `Check and test` がどこにも現れなくなって、すべての PR がマージ不能になる。
  cross:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方が落ちても、もう片方の結果は知りたい。
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `crates/app` は `web/dist` を実行ファイルに埋め込むので、ここでも
      # 先に組み立てます。型検査と lint は ubuntu だけで回します
      # (プラットフォームに依らないので)。
      - name: Build the webview
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # fmt と clippy はプラットフォームに依らないので ubuntu だけで回す。
      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --workspace --all-features
