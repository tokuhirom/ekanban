name: Release

# タグを打つとビルドして GitHub Release に上げます。
#
# 入口は 2 つあります。
#   push (tags)       tagpr が打ったタグと、手で `git push origin v0.1.0` したとき
#   workflow_dispatch tag を渡すとそのタグで公開し、空ならビルドの確認だけします
#
# tagpr は GitHub App のインストールトークンでタグを打ちます。GITHUB_TOKEN と違い
# App のトークンで作られたイベントは push を発火するので、tagpr のタグはそのまま
# ここに届きます (tagpr.yml を見てください)。workflow_dispatch のほうは、手で
# やり直したいときと、リリースを伴わないビルド確認のために残してあります。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するタグ (例: v0.1.0)。空にすると 3 つのプラットフォームでビルドが通るかだけ見て、リリースには何も上げません。"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Resolve the release target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      publish: ${{ steps.resolve.outputs.publish }}

    steps:
      - name: Resolve the tag to build
        id: resolve
        env:
          # 式を直接 run に埋めると、入力がシェルに解釈されてしまう。
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          fi

          if [ -z "$tag" ]; then
            # 公開しない確認ビルド。成果物の名前には短い SHA を使う。
            {
              echo "tag="
              echo "version=$(printf '%s' "$SHA" | cut -c1-7)"
              echo "ref=$SHA"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            echo "確認ビルドとして走ります (リリースには上げません)"
            exit 0
          fi

          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::タグは v から始まるバージョンにしてください: $tag"; exit 1 ;;
          esac

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "ref=$tag"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "$tag を公開します"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      # 1 つ落ちても、他のプラットフォームの結果は見たい。
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundles: app,dmg
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            bundles: deb,appimage
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}

      # WebKitGTK 一式。`librsvg2-dev` と `patchelf` は AppImage を組むのに、
      # `xdg-utils` はその中に `xdg-open` を入れるのに要ります（無いと
      # 「xdg-open binary not found」でバンドルが落ちます）。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Tauri の CLI は画面側の devDependencies に入っています。バンドラは
      # ここから呼ぶので、別に入れるものはありません。`tauri build` が
      # `npm run build` を先に走らせて `web/dist` を作ります。
      - name: Install the webview dependencies
        run: npm --prefix web ci

      # バンドラに渡すのは、その OS で配るものだけ。**署名は ad-hoc のまま**で、
      # 指定は `tauri.conf.json` にあります（ADR 0014）。
      - name: Build the bundles
        working-directory: crates/app
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: ../../web/node_modules/.bin/tauri build --bundles "$BUNDLES"

      - name: Package the .app
        if: runner.os == 'macOS'
        env:
          ASSET: ekanban-${{ needs.setup.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # zip コマンドではなく ditto を使う。.app のシンボリックリンクと
          # 署名を壊さずに固められるのはこちら。
          ditto -c -k --keepParent \
            "target/release/bundle/macos/Ekanban.app" \
            "dist/$ASSET.zip"
          cp target/release/bundle/dmg/*.dmg "dist/$ASSET.dmg"

      # `.deb` と `.AppImage` に加えて、**root を要求しない導線も残します**
      # （ADR 0013）。実行ファイルだけを配るとアプリ一覧にもタスクバーにも
      # 出てこないので、デスクトップエントリとアイコン、それを入れるスクリプトを
      # 同梱します。
      - name: Package the binary
        if: runner.os == 'Linux'
        env:
          ASSET: ekanban-${{ needs.setup.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ASSET"
          cp target/release/ekanban "dist/$ASSET/"
          cp README.md LICENSE "dist/$ASSET/"
          cp assets/dev.tokuhirom.ekanban.desktop "dist/$ASSET/"
          cp script/install-linux "dist/$ASSET/"
          cp -R assets/icons "dist/$ASSET/"
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
          rm -rf "dist/$ASSET"
          cp target/release/bundle/deb/*.deb "dist/$ASSET.deb"
          cp target/release/bundle/appimage/*.AppImage "dist/$ASSET.AppImage"

      - name: Package the binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ekanban-${{ needs.setup.outputs.version }}-${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist/$env:ASSET" | Out-Null
          Copy-Item target/release/ekanban.exe "dist/$env:ASSET/"
          Copy-Item README.md, LICENSE "dist/$env:ASSET/"
          Compress-Archive -Path "dist/$env:ASSET/*" -DestinationPath "dist/$env:ASSET.zip"
          Remove-Item -Recurse -Force "dist/$env:ASSET"
          # インストーラも配る。実行ファイルだけだと、スタートメニューにも
          # 「アプリと機能」にも出てこない。
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe)[0].FullName "dist/$env:ASSET-setup.exe"

      - name: Upload the built asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [setup, build]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect the assets
        run: |
          set -euo pipefail
          mkdir -p dist
          # アーティファクトがジョブ名のディレクトリに入っても入らなくても拾えるように、
          # 階層を当てにせず平らにする。
          find artifacts -type f -exec mv -t dist {} +
          cd dist
          sha256sum ekanban-* > SHA256SUMS.txt
          ls -l

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          # tagpr は自分で Release を作るので、既にあるなら消さずに足すだけにする。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG の Release は既にあるので、成果物だけ足します"
          else
            echo "$TAG の Release を作ります"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
